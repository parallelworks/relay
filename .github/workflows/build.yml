name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: The commit or tag to build; the triggering commit when empty.
        type: string
        default: ""
      version:
        description: The release version without the leading v; every binary must report it.
        type: string
        default: ""
      publish:
        description: Push the image and chart, then sign and attest everything.
        type: boolean
        default: false
      runner:
        type: string
        default: ubuntu-latest
      artifact:
        description: Name of the artifact that holds dist/.
        type: string
        default: dist
    outputs:
      image-digest:
        value: ${{ jobs.build.outputs.image-digest }}

permissions: {}

env:
  IMAGE: ghcr.io/parallelworks/relay
  CHARTS: oci://ghcr.io/parallelworks/charts

jobs:
  build:
    name: Build (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # keyless signing and attestations
      attestations: write # store the attestations
      packages: write # push the image and chart
    outputs:
      image-digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            *.r2.cloudflarestorage.com:443
            gcr.io:443
            *.gcr.io:443
            *.pkg.dev:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            get.anchore.io:443
            toolbox-data.anchore.io:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            get.helm.sh:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Binaries
        env:
          RELAY_VERSION: ${{ inputs.version }}
        run: ./scripts/build.sh dist
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
      - name: Image
        id: image
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          build() {
            docker buildx build --provenance=false --sbom=false \
              --platform linux/amd64,linux/arm64 \
              --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
              --metadata-file "$RUNNER_TEMP/image.json" --file Dockerfile "$@" dist
          }
          build --output "type=oci,dest=dist/image.tar,rewrite-timestamp=true"
          if [ "$PUBLISH" = true ]; then
            build --output "type=image,name=$IMAGE:$VERSION,push=true,rewrite-timestamp=true"
          fi
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/image.json")
          echo "$digest" > dist/image-digest.txt
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
        env:
          PUBLISH: ${{ inputs.publish }}
          VERSION: ${{ inputs.version }}
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
        with:
          syft-version: v1.54.1
      - name: SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          mkdir -p dist/sbom
          for bin in dist/assets/relay_*; do
            name=$(basename "$bin" .exe)
            "$SYFT" scan "file:$bin" -q \
              -o "spdx-json=dist/sbom/$name.spdx.json" \
              -o "cyclonedx-json=dist/sbom/$name.cdx.json"
          done
          for platform in linux/amd64 linux/arm64; do
            name="image_${platform%/*}_${platform#*/}"
            "$SYFT" scan --platform "$platform" oci-archive:dist/image.tar -q \
              -o "spdx-json=dist/sbom/$name.spdx.json" \
              -o "cyclonedx-json=dist/sbom/$name.cdx.json"
          done
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Chart
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            chart=$(helm show chart deploy/helm/relay)
            printf '%s\n' "$chart" | grep -qx "version: $VERSION" || { echo "Chart.yaml version is not $VERSION"; exit 1; }
            printf '%s\n' "$chart" | grep -qx "appVersion: $VERSION" || { echo "Chart.yaml appVersion is not $VERSION"; exit 1; }
          fi
          helm package deploy/helm/relay --destination dist/chart

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.publish
      - name: Sign the checksums
        if: inputs.publish
        run: cosign sign-blob --yes --bundle dist/assets/checksums.txt.sigstore.json dist/assets/checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: inputs.publish
        with:
          subject-checksums: dist/assets/checksums.txt
      - name: Sign the image
        if: inputs.publish
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: inputs.publish
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        if: inputs.publish
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: dist/sbom/image_linux_amd64.spdx.json
          push-to-registry: true
      - name: Push the chart
        id: chart
        if: inputs.publish
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          out=$(helm push "dist/chart/relay-$VERSION.tgz" "$CHARTS" 2>&1)
          printf '%s\n' "$out"
          digest=$(printf '%s\n' "$out" | sed -n 's/^Digest: //p')
          [ -n "$digest" ] || { echo "helm push printed no digest"; exit 1; }
          cosign sign --yes "${CHARTS#oci://}/relay@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: inputs.publish
        with:
          subject-name: ghcr.io/parallelworks/charts/relay
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
