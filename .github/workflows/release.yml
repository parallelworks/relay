name: Release

on:
  push:
    branches: [canary]
  workflow_dispatch:
    inputs:
      version:
        description: Rebuild and publish the existing release vVERSION, for example 0.1.0.
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and its tag
      pull-requests: write # open the release PR
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: canary
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
      id-token: write # keyless signing and attestations
      attestations: write # store the attestations
      packages: write # push the image and chart
    uses: $/.github/workflows/build.yml
    with:
      ref: ${{ needs.release-please.outputs.tag || format('v{0}', inputs.version) }}
      version: ${{ needs.release-please.outputs.version || inputs.version }}
      publish: true
      artifact: release

  publish:
    name: Publish
    needs: [release-please, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload release assets and notes
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            uploads.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Upload the binaries, checksums, SBOMs and chart
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag || format('v{0}', inputs.version) }}
        run: gh release upload "$TAG" --clobber dist/assets/* dist/sbom/* dist/chart/*
      - name: Record the FIPS module and the image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag || format('v{0}', inputs.version) }}
          VERSION: ${{ needs.release-please.outputs.version || inputs.version }}
          DIGEST: ${{ needs.build.outputs.image-digest }}
        run: |
          {
            gh release view "$TAG" --json body --jq .body
            echo
            echo "## Artifacts"
            echo
            echo "- Go Cryptographic Module: \`$(cat dist/fips140.txt)\` (\`GOFIPS140=certified\`, enforced with \`fips140=only\`)"
            echo "- Image: \`ghcr.io/parallelworks/relay:$VERSION@$DIGEST\`"
            echo "- Chart: \`oci://ghcr.io/parallelworks/charts/relay --version $VERSION\`"
            echo
            echo "Verify a binary with \`gh attestation verify relay_linux_amd64 --repo $GH_REPO\` and the image with \`gh attestation verify oci://ghcr.io/parallelworks/relay@$DIGEST --repo $GH_REPO\`."
          } > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
